<!DOCTYPE html>
<html lang="vi">
<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
  >

  <!-- IOS -->
  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="default"
  >

  <!-- ANDROID -->
  <meta
    name="theme-color"
    content="#ffffff"
  >

  <title>Ghi Số Sầu Riêng</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

  <!-- ICON IOS -->
  <link
    rel="apple-touch-icon"
    sizes="180x180"
    href="apple-touch-icon.png"
  >

  <!-- MANIFEST -->
  <link
    rel="manifest"
    href="manifest.json"
  >

</head>

<body>


<!-- =====================================
            PASSWORD
===================================== -->

<div id="passwordScreen" class="pw-screen hidden">

  <div class="pw-box">

    <h2>Nhập mật khẩu</h2>

    <input
      id="pwInput"
      type="password"
      maxlength="20"
      placeholder="Nhập mật khẩu"
    >

    <button id="pwLoginBtn">
      Mở ứng dụng
    </button>

  </div>

</div>


<!-- =====================================
                APP
===================================== -->

<main class="screen">


  <!-- =====================================
          TOP
  ===================================== -->

  <section class="card card-top">


    <!-- KHO + NGÀY -->
    <div class="top-double">

      <!-- KHO -->
      <input
        type="text"
        id="khoInput"
        class="top-input"
        placeholder="Tên lái"
        autocomplete="off"
      >


      <!-- NGÀY -->
      <div class="date-wrapper">

        <div
          class="date-pill"
          id="datePill"
        ></div>

        <input
          id="dateInput"
          type="date"
          class="date-input-real"
        >

      </div>

    </div>


    <!-- THÁI RI -->
    <div class="select-row">

      <button
        class="btn-select type-btn"
        data-type="thai"
      >
        THÁI
      </button>

      <button
        class="btn-select type-btn"
        data-type="ri"
      >
        RI
      </button>

    </div>


    <!-- BIỂN SỐ + STT -->
    <div class="top-double">

      <!-- BIỂN SỐ -->
      <input
        type="text"
        id="plateInput"
        class="top-input"
        placeholder="Biển số xe"
        autocomplete="off"
      >


      <!-- STT -->
      <input
        type="text"
        id="sttInput"
        class="top-input stt-input"
        placeholder="STT"
        autocomplete="off"
      >

    </div>

  </section>


  <!-- =====================================
                TỔNG
  ===================================== -->

  <section class="card card-totals">


    <!-- A B -->
    <div class="select-row total-select-row">

      <div class="btn-select total-box">
        <div class="total-label">A</div>
        <div class="total-value" id="sumA">0</div>
      </div>

      <div class="btn-select total-box">
        <div class="total-label">B</div>
        <div class="total-value" id="sumB">0</div>
      </div>

    </div>


    <!-- C DẠT KEM -->
    <div class="select-row total-select-row">

      <div class="btn-select total-box">
        <div class="total-label">C</div>
        <div class="total-value" id="sumC">0</div>
      </div>

      <div class="btn-select total-box">
        <div class="total-label">DẠT</div>
        <div class="total-value" id="sumDAT">0</div>
      </div>

      <div class="btn-select total-box">
        <div class="total-label">KEM</div>
        <div class="total-value" id="sumKEM">0</div>
      </div>

    </div>


    <!-- TỔNG -->
    <div class="grand-pill">

      <div class="label">
        Tổng
      </div>

      <div
        class="value"
        id="totalAll"
      >
        0
      </div>

    </div>

  </section>


  <!-- =====================================
                INPUT
  ===================================== -->

  <section class="card card-input">


    <!-- A B C -->
    <div class="select-row">

      <button
        class="btn-select cat-btn"
        data-cat="A"
      >
        A
      </button>

      <button
        class="btn-select cat-btn"
        data-cat="B"
      >
        B
      </button>

      <button
        class="btn-select cat-btn"
        data-cat="C"
      >
        C
      </button>

    </div>


    <!-- DẠT KEM -->
    <div class="select-row">

      <button
        class="btn-select cat-btn"
        data-cat="DAT"
      >
        DẠT
      </button>

      <button
        class="btn-select cat-btn"
        data-cat="KEM"
      >
        KEM
      </button>

    </div>


    <!-- DISPLAY -->
    <div
      class="display-slab"
      id="display"
    >
      SỐ LƯỢNG
    </div>

  </section>


  <!-- =====================================
                KEYPAD
  ===================================== -->

  <nav class="keypad">

    <button class="kbtn num">1</button>
    <button class="kbtn num">2</button>
    <button class="kbtn num">3</button>

    <button class="kbtn num">4</button>
    <button class="kbtn num">5</button>
    <button class="kbtn num">6</button>

    <button class="kbtn num">7</button>
    <button class="kbtn num">8</button>
    <button class="kbtn num">9</button>


    <!-- BACK -->
    <button
      class="kbtn action"
      id="btnBack"
    >
      ⌫
    </button>

    <button class="kbtn num">0</button>

    <button class="kbtn num">.</button>


    <!-- ENTER -->
    <button
      class="kbtn enter"
      id="btnEnter"
    >
      ↵
    </button>

  </nav>


  <!-- =====================================
            BUTTON MỞ POPUP
  ===================================== -->

  <button
    id="openHistory"
    class="history-popup-btn"
  >
    XEM LỊCH SỬ
  </button>


</main>


<!-- =====================================
            POPUP LỊCH SỬ
===================================== -->

<div
  id="historyPopup"
  class="history-popup hidden"
>

  <div class="history-modal">


    <!-- HEADER -->
    <header class="history-header">


      <div class="top-history-title">

        <div class="hist-title">
          LỊCH SỬ NHẬP
        </div>

        <div id="historyDate">
          Ngày …
        </div>

      </div>


      <div class="history-actions">

        <button
          id="clearAll"
          class="small-btn"
        >
          XÓA
        </button>

        <button
          id="closeHistory"
          class="small-btn"
        >
          ĐÓNG
        </button>

      </div>

    </header>


    <!-- BODY -->
    <div
      class="history-body"
      id="historyBody"
    >

      <table class="history-table">

        <thead>

          <tr>

            <th>A</th>

            <th>B</th>

            <th>C</th>

            <th>DẠT</th>

            <th>KEM</th>

          </tr>

        </thead>

        <tbody id="historyTable"></tbody>

      </table>

    </div>

  </div>

</div>


<script src="app.js"></script>

</body>
</html>
