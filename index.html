<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ghi cân</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="stylesheet" href="./style.css">
</head>
<body>

<script>
// Kiểm tra PWA
function isStandalone(){
  return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
}

if(!isStandalone()){
  document.body.innerHTML = `
    <div style="display:flex;flex-direction:column;justify-content:center;align-items:center;height:100vh;text-align:center;padding:20px;">
      <h1>Ứng dụng chỉ chạy khi thêm vào Màn hình chính</h1>
      <p>Vui lòng mở Safari, nhấn nút Chia sẻ → Thêm vào Màn hình chính</p>
    </div>`;
  throw new Error("Not in PWA mode");
}

// Yêu cầu mật khẩu
const APP_PASSWORD = "1234"; // Thay mật khẩu bạn muốn
async function requirePassword(){
  let ok = false;
  while(!ok){
    const pw = prompt("Nhập mật khẩu để mở ứng dụng:");
    if(pw === null){
      document.body.innerHTML = "<p>Bỏ qua, không mở app.</p>";
      throw new Error("Cancelled by user");
    }
    if(pw === APP_PASSWORD){
      ok = true;
    } else alert("Mật khẩu sai, thử lại!");
  }
}

requirePassword().then(()=>{ 
  // Load phần app chính
  document.write(`
<div id="app-container"></div>
<script src="./app.js"></script>
`); 
});
</script>

</body>
</html>
